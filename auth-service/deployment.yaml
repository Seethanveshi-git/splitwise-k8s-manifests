apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 824033491491.dkr.ecr.ap-south-1.amazonaws.com/auth-service:1
          ports:
            - containerPort: 8081
