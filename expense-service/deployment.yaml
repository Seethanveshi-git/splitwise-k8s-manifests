apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-service
  template:
    metadata:
      labels:
        app: expense-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: expense-service
          image: 824033491491.dkr.ecr.ap-south-1.amazonaws.com/expense-service:12
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/micro_service_expense_db
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: password
            - name: EUREKA_SERVER
              value: http://service-registry:8761/eureka
