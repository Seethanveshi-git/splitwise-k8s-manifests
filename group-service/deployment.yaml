apiVersion: apps/v1
kind: Deployment
metadata:
  name: group-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: group-service
  template:
    metadata:
      labels:
        app: group-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: group-service
          image: 824033491491.dkr.ecr.ap-south-1.amazonaws.com/group-service:9
          ports:
            - containerPort: 8084
          env:
            - name: DT_NODE_ID
              value: "Group-Test-In-New-Namespace"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.my-namespace.svc.cluster.local:5432/micro_service_group_db
            
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            
            - name: SPRING_DATASOURCE_PASSWORD
              value: password
            - name: EUREKA_SERVER
              value: http://service-registry.my-namespace.svc.cluster.local:8761/eureka
